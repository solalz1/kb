# Tout en local, pour tester avant de déployer : `docker compose up --build` puis http://localhost:8000
# (Postgres + pgvector local ; les clés API sont lues dans .env)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - files:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
